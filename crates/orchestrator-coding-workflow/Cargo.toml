[package]
name = "orchestrator-coding-workflow"
version = "0.1.0"
edition = "2021"

[dependencies]
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-github = { path = "../orchestrator-github" }
orchestrator-github-webhook = { path = "../orchestrator-github-webhook" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "2"

# Tracing
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
chrono = "0.4"
