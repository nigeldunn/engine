[package]
name = "orchestrator-github"
version = "0.1.0"
edition = "2021"

[dependencies]
orchestrator-core = { path = "../orchestrator-core" }

# Async runtime
tokio = { version = "1", features = ["sync", "time", "rt"] }
async-trait = "0.1"

# GitHub API + JWT for App auth. jsonwebtoken is needed at the call site
# (EncodingKey::from_rsa_pem) — octocrab does not encapsulate key parsing.
octocrab = "0.49"
jsonwebtoken = "10"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "2"

# Tracing
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
