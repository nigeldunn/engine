[package]
name = "orchestrator-github-webhook"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["sync"] }

# HTTP server framework
axum = "0.8"
bytes = "1"
http = "1"

# HMAC-SHA256 validation
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors
thiserror = "2"

# Tracing
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Re-imported for tests so they can sign their own request bodies.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
