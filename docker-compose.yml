services:
  postgres:
    image: postgres:16-alpine
    container_name: orch-pg
    environment:
      POSTGRES_USER: orch
      POSTGRES_PASSWORD: orch
      POSTGRES_DB: orch
    ports:
      - "5432:5432"
    volumes:
      - orch-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orch -d orch"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  orch-pg-data:
