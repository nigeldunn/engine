name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orch
          POSTGRES_PASSWORD: orch
          POSTGRES_DB: orch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orch -d orch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://orch:orch@localhost:5432/orch

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `cargo fmt --check` deliberately omitted: the repo predates a
      # consistent rustfmt style and adopting it would require a
      # workspace-wide reformat outside the scope of this CI scaffold.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --all-targets
      - run: cargo test --all-targets
